services:
  - type: web
    name: smartcart-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        value: rzp_test_demo_smartcart
      - key: RAZORPAY_KEY_SECRET
        value: demo_secret_key_123456
